<rect x="70" y="420" width="240" height="80" rx="8" fill="#fff2cc"/><text x="190" y="453" text-anchor="middle" font-size="16" stroke="none">Add / validate</text><text x="190" y="476" text-anchor="middle" font-size="14" stroke="none">operator&gt;&gt;, new PracticeMatch</text>
<rect x="420" y="420" width="240" height="80" rx="8" fill="#fff2cc"/><text x="540" y="453" text-anchor="middle" font-size="16" stroke="none">View / search</text><text x="540" y="476" text-anchor="middle" font-size="14" stroke="none">polymorphic display</text>
<rect x="770" y="420" width="240" height="80" rx="8" fill="#fce4d6"/><text x="890" y="453" text-anchor="middle" font-size="16" stroke="none">Update / Delete</text><text x="890" y="476" text-anchor="middle" font-size="14" stroke="none">confirm + temp file</text>
<path d="M540 345 L540 380 L190 380 L190 420" fill="none" stroke="#444" marker-end="url(#arrow)"/>
<path d="M540 345 L540 420" fill="none" stroke="#444" marker-end="url(#arrow)"/>
<path d="M540 380 L890 380 L890 420" fill="none" stroke="#444" marker-end="url(#arrow)"/>
