<g font-family="Arial" fill="#222" stroke="#1f4e79" stroke-width="2">
<rect x="390" y="75" width="300" height="60" rx="24" fill="#eaf2f8"/><text x="540" y="112" text-anchor="middle" font-size="17" stroke="none">Start / open CA3 data file</text>
<rect x="365" y="175" width="350" height="70" rx="8" fill="#eaf2f8"/><text x="540" y="205" text-anchor="middle" font-size="16" stroke="none">Migrate legacy CA2 file if needed</text><text x="540" y="226" text-anchor="middle" font-size="14" stroke="none">Load polymorphic records</text>
