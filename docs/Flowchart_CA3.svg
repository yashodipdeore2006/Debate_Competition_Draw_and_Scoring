<path d="M190 500 L190 545 L470 545 L470 580" fill="none" stroke="#444" marker-end="url(#arrow)"/>
<path d="M540 500 L540 580" fill="none" stroke="#444" marker-end="url(#arrow)"/>
<path d="M890 500 L890 545 L610 545 L610 580" fill="none" stroke="#444" marker-end="url(#arrow)"/>
<rect x="390" y="710" width="300" height="60" rx="24" fill="#eaf2f8"/><text x="540" y="747" text-anchor="middle" font-size="17" stroke="none">Return to menu / exit</text>
